[package]
name = "zero-indexer-proto"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "The lightwalletd gRPC types and CompactTxStreamer stubs that the hub and shim share."

# The crate has no build script. `src/compact_formats.rs` and `src/service.rs`
# are generated by `gen/` and committed, so a build needs no protoc and
# regenerates nothing.
[dependencies]
prost = "0.14"
tonic = "0.14"
tonic-prost = "0.14"
