name: zeronym-guards

# Cheap assertions over the repository's own claims, plus the test suites.
#
# Two gaps this closes. First, `guards.sh` checks that documents making
# security claims still agree with the code -- the class of defect that has
# shipped here twice, each time found by a person reading carefully rather than
# by anything automatic. Second, and more basic: before this workflow existed the
# repository had NO cargo test job of any kind. The reproduce workflows were the
# only automated gate and they only rebuild a binary; the 300-odd tests in the
# hub and shim crates ran on developer machines and nowhere else.
#
# Deliberately fast, so it can gate every push: no enclave build, no network, no
# Docker. The reproduce workflows remain the slow half.

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/zeronym-guards.yml"
      - "**"
  pull_request:
    paths:
      - ".github/workflows/zeronym-guards.yml"
      - "**"

concurrency:
  group: zeronym-guards-${{ github.ref }}
  cancel-in-progress: true

# The evaluator that Quint 0.33.0 runs; see the `Quint evaluator` steps.
env:
  QUINT_EVALUATOR_VERSION: v0.7.0
  QUINT_EVALUATOR_SHA256: 869adb8762a518483eb39f67fde622253a58527494e15afe77d610a0b6dab7d2

jobs:
  # Runs on its own and on the cheap runner: a failure here is a document making
  # a claim the code does not support, and it should be visible without waiting
  # for a compile.
  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Repository claim guards
        run: sh guards.sh

  # The Quint specification of the protocol: typecheck, tests
  # and bounded random simulation. About 2 minutes on a 16-core machine.
  spec-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # It runs code fetched at run time (npx, Quint's evaluator), so it gets a
    # read-only token and a pinned checkout.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Quint fetches its evaluator through the GitHub REST API, which
      # rate-limits shared runners. With the release asset already in
      # ~/.quint, Quint makes no API call.
      - name: Quint evaluator
        run: |
          dir=$HOME/.quint/rust-evaluator-$QUINT_EVALUATOR_VERSION
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/evaluator.tar.gz" \
            "https://github.com/quint-co/quint/releases/download/evaluator/$QUINT_EVALUATOR_VERSION/quint_evaluator-x86_64-unknown-linux-gnu.tar.gz"
          echo "$QUINT_EVALUATOR_SHA256  $RUNNER_TEMP/evaluator.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/evaluator.tar.gz" -C "$dir"
      - name: Protocol specification, tiers 1 to 3b
        run: sh spec/quint/check.sh
        env:
          CHECK_TIERS: simulation

  # The hub specification checked exhaustively with TLC, which needs Java. The
  # Apalache distribution that carries TLC is fetched by Quint on first use.
  # About 8.5 minutes on a 16-core machine with four rows at a time. Rows that
  # expect a violation run TLC on one worker, so the trace lengths are
  # shortest; two rows at a time with 6 GB each fit a 4-core, 16 GB runner.
  spec-protocol-tlc:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Tier 4 split across runners: each runs every third row.
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/3', '2/3', '3/3']
    # Same reasoning as `spec-protocol`: it runs code fetched at run time.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Quint evaluator
        run: |
          dir=$HOME/.quint/rust-evaluator-$QUINT_EVALUATOR_VERSION
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/evaluator.tar.gz" \
            "https://github.com/quint-co/quint/releases/download/evaluator/$QUINT_EVALUATOR_VERSION/quint_evaluator-x86_64-unknown-linux-gnu.tar.gz"
          echo "$QUINT_EVALUATOR_SHA256  $RUNNER_TEMP/evaluator.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/evaluator.tar.gz" -C "$dir"
      - name: Hub specification, tier 4 (shard ${{ matrix.shard }})
        run: sh spec/quint/check.sh
        env:
          CHECK_TIERS: tlc
          CHECK_SHARD: ${{ matrix.shard }}
          QUINT_JOBS: '4'
          TLC_HEAP: 3g
          TLC_TIMEOUT: '900'

  # Formatting drift, on the cheap runner and without waiting for a compile.
  # `hub` and `shim` are separate workspaces, so each gets its own step.
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: hub fmt
        working-directory: hub
        run: cargo fmt --check

      - name: shim fmt
        working-directory: shim
        run: cargo fmt --check

  # Every dependency in both lockfiles has an audit or a recorded exemption in
  # that workspace's `supply-chain/`. `--locked` uses the committed imports, so
  # the job needs no audit fetch and a new dependency fails here until someone
  # records it.
  vet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-vet@0.10.2

      - name: hub vet
        working-directory: hub
        run: cargo vet --locked

      - name: shim vet
        working-directory: shim
        run: cargo vet --locked

  # Clippy with warnings as errors, on the default build and on every feature.
  # The allowed style lints are listed under `[lints.clippy]` in each Cargo.toml.
  clippy:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: clippy
          workspaces: |
            hub
            shim

      - name: hub clippy
        working-directory: hub
        run: |
          cargo clippy --all-targets --locked -- -D warnings
          cargo clippy --all-targets --locked --all-features -- -D warnings

      - name: shim clippy
        working-directory: shim
        run: |
          cargo clippy --all-targets --locked -- -D warnings
          cargo clippy --all-targets --locked --all-features -- -D warnings

  # The committed gRPC code in `proto/src` is what the generator
  # produces from `proto/proto`. The hub and shim compile the committed
  # files, so a hand edit or a stale file fails here.
  proto:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      # Pinned, so the same commit always meets the same generator input.
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: protoc@3.36.2

      - name: Regenerate and compare
        run: |
          cargo run --locked --manifest-path proto/gen/Cargo.toml
          git diff --exit-code -- proto/src

  tests:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      # `hub` and `shim` each declare their own `[workspace]`, so they are two
      # separate build graphs with two separate target directories. Naming both
      # is what makes the cache cover the second one.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            hub
            shim

      - name: hub tests
        working-directory: hub
        run: cargo test --all-targets

      - name: shim tests
        working-directory: shim
        run: cargo test --all-targets

  # The mixnet driver is behind a feature, and a plain `cargo test` therefore
  # never compiles it -- so eight tests do not run, including all three
  # regressions for the liveness-probe finding the review raised. Measured
  # 2026-08-19: hub 147 -> 152, shim 189 -> 192.
  #
  # A separate job because it pulls the whole nym-sdk dependency tree, which is
  # most of the build time (6m22s cold versus 2m27s without). Running it beside
  # the plain job rather than after keeps the wall clock flat, and the cache
  # makes the second run cheap.
  tests-mixnet:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: mixnet
          workspaces: |
            hub
            shim

      - name: hub tests (mixnet-driver)
        working-directory: hub
        run: cargo test --all-targets --features mixnet-driver

      - name: shim tests (mixnet-driver)
        working-directory: shim
        run: cargo test --all-targets --features mixnet-driver
