name: zeronym-latest-blocks

# Does the zebra-chain the shim pins still read what the chain mines?
#
# At NU7 it did not. The pin predated the new consensus branch, so every
# transaction after activation failed to parse, and the first sign of it was
# the upgrade itself. NU7 activated on testnet on 4 October 2026 and on mainnet
# 32 days later, and this check pointed at testnet would have been red for all
# of them.
#
# Each job starts a forward-only shim in front of a real lightwalletd, reads 40
# recent blocks through it, and fails on any transaction the classifier cannot
# parse (shim/tests/latest_blocks.rs). It also fails if the server is
# on the wrong chain or has stopped following it. Testnet is the early warning
# and mainnet is the backstop.
#
# The hub pins its own zebra-chain, at the same version today. This builds the
# shim's only.
#
# The lightwalletd for each network is a repository variable, as `host:port`,
# so that nobody's server is written into this file:
#
#   ZERONYM_MAINNET_LIGHTWALLETD
#   ZERONYM_TESTNET_LIGHTWALLETD
#
# A job whose variable is unset FAILS. One that skipped would look exactly
# like one that passed.

on:
  schedule:
    # Daily, off the hour, and clear of the Monday z3 runs at 06:17 and 06:47.
    - cron: "23 5 * * *"
  workflow_dispatch:
  # A change to the check, to the pin it checks, or to the shim's own source
  # runs it before merging: the classifier does the parsing and the proxy
  # carries the bytes. This trigger is a convenience on top of the daily run,
  # so an event its `paths:` filter drops loses nothing the schedule will not
  # catch.
  pull_request:
    paths:
      - ".github/workflows/zeronym-latest-blocks.yml"
      - "shim/Cargo.toml"
      - "shim/Cargo.lock"
      - "shim/src/**"
      - "shim/tests/latest_blocks.rs"
      - "shim/tests/common/**"

permissions:
  contents: read

concurrency:
  group: zeronym-latest-blocks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  latest-blocks:
    name: latest blocks (${{ matrix.network }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # One network failing says nothing about the other.
      fail-fast: false
      matrix:
        include:
          # `chain` is what the server's GetLightdInfo must report, so a
          # variable pointing at the wrong network fails the job.
          - network: mainnet
            chain: main
            lightwalletd: ${{ vars.ZERONYM_MAINNET_LIGHTWALLETD }}
          - network: testnet
            chain: test
            lightwalletd: ${{ vars.ZERONYM_TESTNET_LIGHTWALLETD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: latest-blocks
          workspaces: shim

      # The shim dials a literal address and verifies the certificate against
      # the name, so the name is resolved here and both are handed to the test.
      - name: Resolve the lightwalletd
        env:
          LIGHTWALLETD: ${{ matrix.lightwalletd }}
          NETWORK: ${{ matrix.network }}
        run: |
          set -euo pipefail
          if [ -z "$LIGHTWALLETD" ]; then
            echo "::error::no lightwalletd is set for $NETWORK; set the repository variable named at the top of this workflow"
            exit 1
          fi
          host=${LIGHTWALLETD%:*}
          port=${LIGHTWALLETD##*:}
          addr=$(getent ahostsv4 "$host" | awk 'NR == 1 { print $1 }' || true)
          if [ -z "$addr" ]; then
            echo "::error::$host does not resolve"
            exit 1
          fi
          echo "ZIS_TEST_BACKEND=$addr:$port" >> "$GITHUB_ENV"
          echo "ZIS_TEST_BACKEND_TLS=$host" >> "$GITHUB_ENV"

      # `--locked` because the pinned parser is the thing under test.
      #
      # shortcut: `cargo test` builds zebra-chain with the shim's dev-only
      # `proptest-impl` feature, which the shipped shim does not have. In
      # 15.0.0 that feature changes no consensus branch id. Look again when
      # the pin moves.
      - name: Parse the latest blocks
        working-directory: shim
        env:
          ZIS_TEST_CHAIN: ${{ matrix.chain }}
        run: cargo test --locked --test latest_blocks -- --ignored --nocapture
